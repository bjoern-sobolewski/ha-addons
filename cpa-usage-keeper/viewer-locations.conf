# Exact method/path allowlist. Never forward admin login or admin APIs.
proxy_cookie_path / __VIEWER_PATH__/;
location = __VIEWER_PATH__ { return 308 __VIEWER_PATH__/; }
location ~ ^__VIEWER_PATH__/(?:|key-overview|key-realtime|key-analysis|key-ranking|key-quota|read-only(?:/realtime|/analysis|/quota|/ranking|/events|/auth-files|/ai-provider)?)$ {
  if ($request_method != GET) { return 404; }
  rewrite ^__VIEWER_PATH__/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:8080;
  sub_filter_once on;
  sub_filter '<head>' '<head><base href="__VIEWER_PATH__/">';
  sub_filter 'window.__APP_BASE_PATH__ = "";' 'window.__APP_BASE_PATH__ = "__VIEWER_PATH__"; window.__KEEPER_VIEWER_ONLY__ = true;';
}
location ~ ^__VIEWER_PATH__/assets/[A-Za-z0-9_.-]+$ {
  if ($request_method !~ ^(GET|HEAD)$) { return 404; }
  rewrite ^__VIEWER_PATH__/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:8080;
}
location ~ ^__VIEWER_PATH__/api/v1/(?:auth/session|version|key-quota|read-only/(?:keys|overview|key-quota|key-overview(?:/comparisons|/realtime)?|key-activity|key-analysis(?:/latency)?|events(?:/filters|/export)?|accounts(?:/[1-9][0-9]*(?:/(?:weekly-quota|performance))?|/quota-cache)?|ranking/local/leaderboards)|key-overview(?:/comparisons|/realtime)?|key-activity|key-analysis(?:/latency)?|key-ranking/leaderboards(?:/metadata)?|key-ranking/local/leaderboards)$ {
  if ($request_method != GET) { return 404; }
  rewrite ^__VIEWER_PATH__/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:8080;
}
location ~ ^__VIEWER_PATH__/api/v1/auth/(?:api-key-login|read-only-login|logout)$ {
  if ($request_method != POST) { return 404; }
  rewrite ^__VIEWER_PATH__/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:8080;
}
