# Exact method/path allowlist. Never forward admin login or admin APIs.
location = /keeper { return 308 /keeper/; }
location ~ ^/keeper/(?:|key-overview|key-realtime|key-analysis|key-ranking|key-quota)$ {
  if ($request_method != GET) { return 404; }
  rewrite ^/keeper/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:8080;
  sub_filter_once on;
  sub_filter 'window.__APP_BASE_PATH__ = "";' 'window.__APP_BASE_PATH__ = "/keeper"; window.__KEEPER_VIEWER_ONLY__ = true;';
}
location ~ ^/keeper/assets/[A-Za-z0-9_.-]+$ {
  if ($request_method !~ ^(GET|HEAD)$) { return 404; }
  rewrite ^/keeper/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:8080;
}
location ~ ^/keeper/api/v1/(?:auth/session|version|key-quota|key-overview(?:/comparisons|/realtime)?|key-activity|key-analysis(?:/latency)?|key-ranking/leaderboards(?:/metadata)?|key-ranking/local/leaderboards)$ {
  if ($request_method != GET) { return 404; }
  rewrite ^/keeper/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:8080;
}
location ~ ^/keeper/api/v1/auth/(?:api-key-login|logout)$ {
  if ($request_method != POST) { return 404; }
  rewrite ^/keeper/(.*)$ /$1 break;
  proxy_pass http://127.0.0.1:8080;
}
